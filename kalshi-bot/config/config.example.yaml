# Phase 1 configuration. Copy to config/config.yaml (gitignored by default
# if you keep secrets here -- but this file holds no secrets; credentials
# live in .env). Values here are limits and tuning, never keys.

# Which market family this process trades: "weather" or "sports". ONE per
# process -- to run both, keep two config files pointing at two databases
# (storage.db_path) and start the bot twice.
market_family: weather

storage:
  db_path: ./data/kalshibot.db

logging:
  dir: ./logs
  level: INFO                 # DEBUG | INFO | WARNING | ERROR
  max_bytes: 10485760         # 10 MB per file
  backup_count: 20            # ~200 MB ceiling, then oldest rotated out

# Which Kalshi daily-high-temperature cities to track. Each maps to the NWS
# station its market settles against, and the lat/lon used for forecasts.
# Verify station IDs against each market's settlement source before trusting.
weather:
  forecast_poll_seconds: 3600         # forecast models update ~hourly
  observation_poll_seconds: 900       # METAR observations refresh ~every 15-60 min
  # Ensemble members. Each is stored and combined; disagreement between them
  # becomes the model's uncertainty. HRRR/GFS/ECMWF are served (decoded) by
  # Open-Meteo -- see clients/forecast_providers.py for why.
  forecast_providers:
    - nws                # NOAA NWS gridpoint forecast
    - open_meteo_best    # Open-Meteo auto blend
    - open_meteo_hrrr    # NOAA HRRR (high-res short-range)
    - open_meteo_gfs     # NOAA GFS (global)
    - open_meteo_ecmwf   # ECMWF IFS open data
  # What has actually happened so far today; clamps the model near settlement.
  observation_providers:
    - metar              # airport METAR observations
  cities:
    - name: Chicago
      kalshi_series: KXHIGHCHI
      nws_station: KMDW               # Midway -- confirm against market rules
      lat: 41.786
      lon: -87.752
    - name: New York
      kalshi_series: KXHIGHNY
      nws_station: KNYC
      lat: 40.779
      lon: -73.969

# Sports game-winner markets ("Will <team> win?"). Only read when
# market_family is "sports". Same shape as the weather section above: several
# independent rating methods form an ensemble, and a live feed of what has
# actually happened clamps the answer as the game runs out.
sports:
  schedule_poll_seconds: 1800         # re-link Kalshi markets to real games
  rating_poll_seconds: 1800           # recompute each member's predicted margin
  state_poll_seconds: 60              # live score -- the fast one that matters
  results_poll_seconds: 21600         # completed games, for the Elo member
  schedule_horizon_days: 4            # how far ahead to rate games
  results_lookback_days: 45           # history the Elo member replays
  # A game that has started but whose score is older than this leaves the model
  # with no opinion. An in-progress game with a dead feed is exactly where a
  # pre-game probability is most confidently wrong.
  max_state_age_seconds: 900
  # Ensemble members. Each is stored and combined; disagreement between them
  # becomes the model's uncertainty (see clients/sports_providers.py).
  rating_providers:
    - elo                # Elo replayed from collected results (recent form)
    - log5               # Bradley-Terry on season win-loss records
    - pythagorean        # expected win rate from runs/points for and against
    # - espn_bookmaker   # sportsbook line. OFF BY DELIBERATE DEFAULT: it is
    #                    # another market's price, not an independent model, and
    #                    # switching it on changes the experiment from "can a
    #                    # model beat Kalshi" to "does Kalshi disagree with
    #                    # DraftKings". It also costs one request per game.
  pythagorean_exponent: 1.83          # baseball value; sane elsewhere
  # What has actually happened so far; clamps the model as the game progresses.
  state_providers:
    - espn_scoreboard
  # Leagues to track. The three physical constants are REQUIRED per league --
  # a margin sigma borrowed from another sport silently ruins every probability.
  #   margin_sigma          std-dev of final margin (runs/points)
  #   home_advantage_margin expected margin from playing at home
  #   regulation_periods    innings / quarters / periods in regulation
  # Kalshi series tickers and team codes below were verified against live market
  # metadata (2026-07); a league Kalshi has no open markets for is commented out
  # because its ticker shape is UNVERIFIED -- check it before trusting it.
  leagues:
    - name: mlb
      kalshi_series: KXMLBGAME
      espn_path: baseball/mlb
      margin_sigma: 4.4               # MLB run-margin spread, ~4.3-4.5
      home_advantage_margin: 0.25     # ~52.5% home win rate in run terms
      regulation_periods: 9
      # The classic baseball Elo K is ~4, but that assumes ratings carried over
      # from previous seasons. This bot starts everyone level and replays only
      # results_lookback_days, and at K=4 that cold start barely separates the
      # league (verified: a 30-day history spread Elo margins over half a run
      # while the record-based members spread over five). Larger K buys
      # separation at the cost of noise; if you lengthen the lookback, lower it.
      elo_k: 10.0
      elo_home_advantage: 25.0        # Elo points
      elo_min_games: 10
    # - name: nfl
    #   kalshi_series: KXNFLGAME       # verified: KXNFLGAME-26AUG15DALSEA-SEA
    #   espn_path: football/nfl
    #   margin_sigma: 13.5             # NFL point-margin spread
    #   home_advantage_margin: 1.5
    #   regulation_periods: 4
    #   elo_k: 30.0                    # 17 games, so each one moves a rating a lot
    #   elo_home_advantage: 55.0
    #   elo_min_games: 6               # NB: pre-season games carry little signal

collection:
  book_poll_seconds: 60               # order-book snapshot cadence
  # Trades are stored for later research; no model reads them. Polling them at
  # book cadence doubled the Kalshi request rate for no benefit.
  trade_poll_seconds: 300
  # Price levels kept per side of the book. The model uses best bid/ask; full
  # depth cost ~240 MB/day. 0 keeps everything.
  book_depth_levels: 10
  book_poll_seconds_near_settlement: 15
  near_settlement_minutes: 120        # "near settlement" window before close
  settlement_poll_seconds: 300        # how often to check for resolved markets

# Risk gates. These BLOCK live orders; paper records are always written.
# The 1-contract position ceiling is NOT here on purpose -- it is a hard-coded
# constant in execution/live_engine.py and cannot be raised from config.
risk:
  min_edge_after_fees: 0.05           # 5 percentage points, intentionally strict
  # Refuse to cross a book wider than this. Edge is computed at the ask, so a
  # wide quote manufactures apparent edge: on a market quoted 54/61 you are 3.5c
  # behind fair before the model has been right about anything.
  # Measured across 95 live MLB books (2026-07): within 48h of first pitch the
  # median spread was 1c and nothing exceeded 3c; beyond 48h the median was 5c.
  # So 3 admits every liquid market and excludes the far-dated ones nobody is
  # trading yet. Comment out to disable the gate entirely.
  max_spread_cents: 3
  price_band_reject_low: 0.40         # reject trades priced 40c..60c
  price_band_reject_high: 0.60
  max_open_markets: 3
  max_total_exposure_pct: 0.02        # cap open exposure at 2% of cash balance
  max_book_age_seconds: 120           # staleness gate for order book
  max_forecast_age_seconds: 21600     # 6h staleness gate for forecast inputs
  daily_loss_limit_cents: 500         # circuit breaker; manual reset required
  kill_switch_file: ./HALT            # if this file exists, no live orders

model:
  # Weather: std-dev (in degrees F) of the settlement-high distribution around
  # the forecast high. Wider = more uncertain = fewer high-edge signals.
  forecast_sigma_f: 3.0
  # Sports: floor (in runs/points) under the ensemble's uncertainty. The sports
  # members all read the same season from the same feed, so unlike the weather
  # models they agree more than they are jointly right -- this stops a false
  # consensus from producing a confident probability. 0 disables the floor.
  min_sigma_floor: 1.0

# Micro-live execution. OFF by default. Turning this on still only ever
# places 1-contract orders, and only when every risk gate passes.
live_trading:
  enabled: false                      # operator must set true by hand
  resting_order_timeout_seconds: 300  # cancel unfilled maker orders after this
